# Worktrunk user configuration.
#
# Canonical worktree location for every repository: a sibling of the repository
# root, named `<repo>.<branch-slug>`.
worktree-path = "../{{ repo }}.{{ branch | sanitize }}"

# Keep the primary checkout as a clean, current control checkout. Task changes
# belong in branch worktrees, so every switch starts from the same GitHub state.
[pre-switch]
primary = """
# Harlan GitHub Agent owns its checkouts and names itself here. The control
# checkout rule below applies to a person.
if [ -n "$HARLAN_GITHUB_AGENT" ]; then
  exit 0
fi
primary="{{ primary_worktree_path }}"
if ! git -C "$primary" remote get-url origin >/dev/null 2>&1; then
  echo "Worktree switch stopped: the primary checkout needs an origin remote." >&2
  exit 1
fi
primary_branch="$(git -C "$primary" symbolic-ref --quiet --short HEAD)" || {
  echo "Worktree switch stopped: the primary checkout must use main." >&2
  exit 1
}
if [ "$primary_branch" != main ]; then
  echo "Worktree switch stopped: the primary checkout must use main." >&2
  exit 1
fi
if [ -n "$(git -C "$primary" status --porcelain=v1 --untracked-files=normal)" ]; then
  echo "Worktree switch stopped: primary main has local changes." >&2
  exit 1
fi
if ! timeout --signal=TERM --kill-after=10s 60s git -C "$primary" -c credential.interactive=never fetch --quiet --prune origin; then
  echo "Worktree switch stopped: origin fetch failed." >&2
  exit 1
fi
if ! git -C "$primary" -c core.hooksPath=/dev/null merge --ff-only --quiet refs/remotes/origin/main; then
  echo "Worktree switch stopped: primary main cannot fast-forward to origin/main." >&2
  exit 1
fi
if [ "$(git -C "$primary" rev-parse HEAD)" != "$(git -C "$primary" rev-parse refs/remotes/origin/main)" ]; then
  echo "Worktree switch stopped: primary main does not match origin/main." >&2
  exit 1
fi
"""

[pre-start]
pnpm = """
if [ -f {{ primary_worktree_path }}/pnpm-lock.yaml ] && [ -f pnpm-lock.yaml ]; then
  timeout --signal=TERM --kill-after=10s 180s pnpm install --frozen-lockfile --prefer-offline --ignore-scripts --ignore-pnpmfile --reporter=append-only
fi
"""
env = """
repository_env="$HOME/.local/bin/harlan-repository-env"
if [ ! -x "$repository_env" ]; then
  echo "Worktree setup stopped: the repository environment helper is missing." >&2
  exit 1
fi
"$repository_env" seed "{{ primary_worktree_path }}" "$PWD"
"""
state = """
for state_dir in .data .wrangler/state; do
  source_state="{{ primary_worktree_path }}/$state_dir"
  if [ -d "$source_state" ] && [ ! -e "$state_dir" ] && git -C "{{ primary_worktree_path }}" check-ignore --quiet -- "$state_dir"; then
    if lsof -t +D "$source_state" 2>/dev/null | grep --quiet .; then
      echo "Worktree setup stopped: $state_dir is active in the primary worktree." >&2
      exit 1
    fi
    mkdir -p "$(dirname "$state_dir")"
    cp --archive --reflink=auto "$source_state" "$state_dir"
  fi
done
"""

[list]
json-schema = 2
