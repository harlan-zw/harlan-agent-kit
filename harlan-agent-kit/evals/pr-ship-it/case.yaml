schema_version: "1.0"
name: pr-ship-it
description: The pr skill fires on "ship it" and delivers via a branch and a PR.
execution:
  max_turns: 25
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Edit, Write]
  scaffold_script: |
    set -e
    mkdir -p hooks
    printf '#!/usr/bin/env bash\necho "Nuxt App: $(basename "$PWD")"\n' > hooks/session-start.sh
    chmod +x hooks/session-start.sh
    git init -q -b main
    git config user.email eval@example.com
    git config user.name Eval
    git add -A
    git commit -qm "chore: add the session start hook"
    printf '#!/usr/bin/env bash\necho "Nuxt App: $(basename "$PWD")"\necho "Branch: $(git branch --show-current)"\n' > hooks/session-start.sh
  prompt: |
    I finished the change to `hooks/session-start.sh`. It now prints the branch
    name under the repo name. Ship it.

    This repo has no `origin` remote. When you reach the push, stop and tell me
    the exact command and the pull request title you would use.
